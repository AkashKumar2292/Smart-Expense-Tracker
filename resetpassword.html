<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Reset Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="form-container">
            <form id="resetPasswordForm" class="active-form">
                <h2>Set New Password</h2>
                <p style="color: #6b7280; margin-bottom: 1.5rem; font-size: 0.9rem;">Enter a strong new password below.</p>
                
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-input" id="newPassword" placeholder="Min 8 chars, 1 Capital, 1 Symbol" required>
                        <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" id="resetBtn">Update Password</button>
                
                <p class="form-switch-text"><a href="login.html">Back to Login</a></p>
            </form>
        </div>
    </div>
    <script type="module" src="resetpassword.js"></script>
</body>
</html>
